name: Fix syntax errors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply fixes
        run: |
          sed -i 's/setUserDropdownOpen(\[userDropdownOpen)/setUserDropdownOpen(!userDropdownOpen)/' components/Navbar.tsx
          sed -i 's/\\"/"/g' components/Footer.tsx
          sed -i 's/^                    target="_blank"$/                  target="_blank"/' components/Footer.tsx
          sed -i 's/^                    rel="noopener noreferrer"$/                  rel="noopener noreferrer"/' components/Footer.tsx
          sed -i 's/^                    aria-label="RWS Tech on Facebook"$/                  aria-label="RWS Tech on Facebook"/' components/Footer.tsx
          sed -i 's/opengraph:/openGraph:/' app/layout.tsx

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair transcription artifacts in Navbar, Footer and layout"
          git push
